<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ego2 视频流查看器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .input-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 15px 30px;
            font-size: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .instructions {
            background: rgba(255,255,255,0.1);
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .instructions h3 {
            margin-bottom: 10px;
        }

        .instructions ol {
            margin-left: 20px;
        }

        .instructions li {
            margin-bottom: 5px;
        }

        .video-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }

        #videoFrame {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
        }

        .status.loading {
            background: #fff3cd;
            color: #856404;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .example {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📹 Ego2 视频流查看器</h1>

        <div class="instructions">
            <h3>📝 使用说明：</h3>
            <ol>
                <li>在iPhone上打开Ego2应用并点击"启动"按钮</li>
                <li>记录应用中显示的访问地址（例如：http://192.168.1.100:8080）</li>
                <li>在下方输入框中输入该地址</li>
                <li>点击"连接视频流"按钮</li>
                <li>等待几秒钟，视频流将自动显示</li>
            </ol>
        </div>

        <div class="input-section">
            <div class="input-group">
                <input 
                    type="text" 
                    id="streamUrl" 
                    placeholder="请输入视频流地址，例如：http://192.168.1.100:8080"
                    value="http://192.168.1.100:8080"
                />
                <button onclick="connectStream()">🎬 连接视频流</button>
            </div>
            <div class="example">
                💡 示例地址：http://192.168.1.100:8080
            </div>
        </div>

        <div class="video-section">
            <img id="videoFrame" src="" alt="视频流将在此处显示" style="display:none;">
            <div id="status" class="status loading">
                等待连接视频流...
            </div>
        </div>

        <div class="footer">
            <p>© 2025 Ego2 | WiFi视频流应用</p>
            <p style="font-size: 0.9em; margin-top: 10px;">
                确保您的设备与iPhone连接在同一WiFi网络
            </p>
        </div>
    </div>

    <script>
        function connectStream() {
            const urlInput = document.getElementById('streamUrl');
            const videoFrame = document.getElementById('videoFrame');
            const status = document.getElementById('status');
            const url = urlInput.value.trim();

            // 验证URL
            if (!url) {
                status.className = 'status error';
                status.textContent = '❌ 请输入视频流地址';
                return;
            }

            if (!url.startsWith('http://')) {
                status.className = 'status error';
                status.textContent = '❌ 地址必须以 http:// 开头';
                return;
            }

            // 显示连接中状态
            status.className = 'status loading';
            status.textContent = '🔄 正在连接视频流...';
            videoFrame.style.display = 'none';

            // 设置视频源
            videoFrame.src = url;

            // 监听加载事件
            videoFrame.onload = function() {
                status.className = 'status success';
                status.textContent = '✅ 视频流连接成功！';
                videoFrame.style.display = 'block';
            };

            videoFrame.onerror = function() {
                status.className = 'status error';
                status.textContent = '❌ 无法连接视频流。请检查：\n1. iPhone应用是否已启动\n2. 设备是否在同一WiFi网络\n3. IP地址是否正确';
                videoFrame.style.display = 'none';
            };
        }

        // 页面加载时的提示
        window.addEventListener('load', function() {
            const status = document.getElementById('status');
            status.textContent = '👋 欢迎使用Ego2视频流查看器！请输入视频流地址并点击连接按钮。';
        });

        // 支持回车键连接
        document.getElementById('streamUrl').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                connectStream();
            }
        });
    </script>
</body>
</html>
